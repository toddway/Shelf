apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlinx.kover'
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'maven-publish'

kotlin {
    jvm()
    // Browser only, matching :shelf (the JS DiskStorage depends on the browser's localStorage).
    js(IR) {
        browser()
    }
    iosX64()
    iosArm64()
    iosSimulatorArm64()

    sourceSets {
        commonMain.dependencies {
            api project(':shelf')
            api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
        }
        commonTest.dependencies {
            implementation kotlin('test')
        }
        jvmTest.dependencies {
            implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
        }
    }
}

// Static analysis. detekt only emits the findings report; the BuildChecks gate decides pass/fail.
detekt {
    buildUponDefaultConfig = true
    ignoreFailures = true
    source.setFrom("src/commonMain/kotlin")
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    reports {
        xml.required = true
        html.required = true
        txt.required = false
        sarif.required = false
        md.required = false
    }
}

// See :shelf for the publishing model. Publishes into the same root build/maven-repo layout.
publishing {
    repositories {
        maven {
            name = 'pages'
            url = rootProject.layout.buildDirectory.dir('maven-repo')
        }
    }
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Shelf Coroutines'
            description = 'Coroutine/Flow extensions for Shelf (ShelfList).'
            url = POM_URL
            licenses {
                license {
                    name = POM_LICENCE_NAME
                    url = POM_LICENCE_URL
                }
            }
            developers {
                developer {
                    id = POM_DEVELOPER_ID
                    name = POM_DEVELOPER_NAME
                    url = POM_DEVELOPER_URL
                }
            }
            scm {
                url = POM_SCM_URL
                connection = POM_SCM_CONNECTION
                developerConnection = POM_SCM_DEV_CONNECTION
            }
        }
    }
}
