apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

kotlin {
    // DiskStorage/Clock/Lock are expect/actual classes (Beta in K2); this enables their
    // actualization (incl. via inherited fake-overrides) and silences the Beta warning.
    compilerOptions {
        freeCompilerArgs.add("-Xexpect-actual-classes")
    }

    jvm()
    // Browser only: the JS DiskStorage is backed by the browser's localStorage, which has no Node
    // equivalent. Add nodejs() only alongside a Node-compatible storage backend.
    js(IR) {
        browser()
    }
    iosX64()
    iosArm64()
    iosSimulatorArm64()

    sourceSets {
        commonMain.dependencies {
            implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_version"
        }
        commonTest.dependencies {
            implementation kotlin('test')
        }
        jvmMain.dependencies {
            implementation "com.squareup.moshi:moshi-kotlin:1.6.0"
            implementation 'com.google.code.gson:gson:2.8.6'
        }
        jvmTest.dependencies {
            implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
        }
    }
}
